    <script>
      const opcoes = document.querySelectorAll(".opcao");
      const btnContinuar = document.getElementById("btn-continuar");
      let perfilSelecionado = null;

      function selecionar(el) {
        opcoes.forEach(o => { o.classList.remove("selecionado"); o.setAttribute("aria-checked", "false"); });
        el.classList.add("selecionado");
        el.setAttribute("aria-checked", "true");
        perfilSelecionado = el.dataset.href;
        btnContinuar.classList.add("ativo");
        btnContinuar.disabled = false;
        btnContinuar.setAttribute("aria-disabled", "false");
      }

      opcoes.forEach(opcao => {
        opcao.addEventListener("click", () => selecionar(opcao));
        opcao.addEventListener("keydown", e => {
          if (e.key === "Enter" || e.key === " ") { e.preventDefault(); selecionar(opcao); }
        });
      });

      btnContinuar.addEventListener("click", () => {
        if (perfilSelecionado) window.location.href = perfilSelecionado;
      });
    </script>
