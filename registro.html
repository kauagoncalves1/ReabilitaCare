<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro – ReabilitaCare</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Nunito:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../assets/styles/registro.css" />
      <link rel="stylesheet" href="../assets/styles/hamburger.css" />
</head>
  <body>
    <!-- HEADER -->
    <header>
      <section class="top-header">
        <div class="interface">
          <div class="logotipo">
            <a href="index.html">
              <img
                src="../assets/images/logosemfundo.png"
                alt="Logo ReabilitaCare"
              />
            </a>
          </div>
          <div style="display: flex; align-items: center; gap: 15px">
            <div class="btn-social">
                <a href="https://www.instagram.com/reabilitaacare/" target="_blank"><i class="bi bi-instagram"></i></a>
                <a href="https://wa.me/5521981785065?text=Ol%C3%A1" target="_blank"><i class="bi bi-whatsapp"></i></a>
                <a href="#"><i class="bi bi-facebook"></i></a>
            </div>
          </div>
        </div>
      </section>
  <section class="bottom-header">
    <div class="interface nav-interface">
      <button class="nav-toggle" id="navToggle" aria-label="Abrir menu">
        <i class="bi bi-list" id="navIcon"></i>
      </button>
      <nav id="navMenu">
        <ul>
          <li><a href="index.html">Início</a></li>
          <li><a href="sobre.html">Sobre</a></li>
          <li><a href="agendamentos.html">Agendamentos</a></li>
          <li><a href="contato.html">Contato</a></li>
        </ul>
      </nav>
    </div>
  </section>
    </header>

    <!-- FORMULÁRIO CADASTRO -->
    <main class="registro-main">
      <div class="registro-card">
        <h2>Criar conta</h2>
        <p class="registro-sub">Preencha os dados abaixo para se cadastrar</p>

        <form id="formRegistro">
          <div class="form-row">
            <div class="campo-grupo">
              <label for="nome">Nome Completo</label>
              <input
                type="text"
                id="nome"
                name="nome"
                placeholder="Seu nome completo"
                required
              />
            </div>
            <div class="campo-grupo">
              <label for="email">E-mail</label>
              <input
                type="email"
                id="email"
                name="email"
                placeholder="seu@email.com"
                required
              />
            </div>
          </div>

          <div class="form-row">
            <div class="campo-grupo">
              <label for="cpf">CPF</label>
              <input
                type="text"
                id="cpf"
                name="cpf"
                placeholder="000.000.000-00"
                maxlength="14"
                required
              />
            </div>
            <div class="campo-grupo">
              <label for="telefone">Telefone</label>
              <input
                type="tel"
                id="telefone"
                name="telefone"
                placeholder="(00) 00000-0000"
                required
              />
            </div>
          </div>

          <div class="form-row">
            <div class="campo-grupo">
              <label for="senha">Senha</label>
              <input
                type="password"
                id="senha"
                name="senha"
                placeholder="••••••••"
                required
              />
            </div>
            <div class="campo-grupo">
              <label for="data_nascimento">Data de Nascimento</label>
              <input
                type="date"
                id="data_nascimento"
                name="data_nascimento"
                required
              />
            </div>
          </div>

          <div class="campo-grupo">
            <label>Sexo</label>
            <div class="radio-group">
              <label class="radio-label"
                ><input type="radio" name="sexo" value="masculino" />
                Masculino</label
              >
              <label class="radio-label"
                ><input type="radio" name="sexo" value="feminino" />
                Feminino</label
              >
              <label class="radio-label"
                ><input type="radio" name="sexo" value="outro" /> Outro</label
              >
            </div>
          </div>

          <div class="form-row">
            <div class="campo-grupo">
              <label for="cep">CEP</label>
              <input
                type="text"
                id="cep"
                name="cep"
                placeholder="00000-000"
                maxlength="9"
                required
              />
            </div>
            <div class="campo-grupo">
              <label for="cidade">Cidade</label>
              <input
                type="text"
                id="cidade"
                name="cidade"
                placeholder="Sua cidade"
                required
              />
            </div>
            <div class="campo-grupo">
              <label for="estado">Estado</label>
              <input
                type="text"
                id="estado"
                name="estado"
                placeholder="UF"
                maxlength="2"
                required
              />
            </div>
          </div>

          <button type="submit">Criar Conta</button>

          <p class="login-link">
            Já tem uma conta? <a href="login.html">Entrar</a>
          </p>
        </form>
      </div>
    </main>

    <script>
      // Máscara CPF
      document.getElementById("cpf").addEventListener("input", function () {
        let v = this.value.replace(/\D/g, "").slice(0, 11);
        v = v
          .replace(/(\d{3})(\d)/, "$1.$2")
          .replace(/(\d{3})(\d)/, "$1.$2")
          .replace(/(\d{3})(\d{1,2})$/, "$1-$2");
        this.value = v;
      });

      // Máscara CEP
      document.getElementById("cep").addEventListener("input", function () {
        let v = this.value.replace(/\D/g, "").slice(0, 8);
        if (v.length > 5) v = v.slice(0, 5) + "-" + v.slice(5);
        this.value = v;
      });

      document
        .getElementById("formRegistro")
        .addEventListener("submit", function (e) {
          e.preventDefault();
          const btn = this.querySelector("button[type='submit']");
          btn.textContent = "Cadastrando...";
          btn.disabled = true;
          setTimeout(() => {
            alert("Cadastro realizado com sucesso!");
            window.location.href = "login.html";
          }, 1800);
        });
    </script>
        <script src="../assets/scripts/hamburger.js"></script>
    <script src="../assets/scripts/acessibilidade.js"></script>
</body>
</html>
