<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pagamento – ReabilitaCare</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Nunito:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../assets/styles/pagamentos.css" />
      <link rel="stylesheet" href="../assets/styles/hamburger.css" />
</head>
  <body>
    <!-- HEADER -->
    <header>
      <section class="top-header">
        <div class="interface">
          <div class="logotipo">
            <a href="index.html">
              <img
                src="../assets/images/logosemfundo.png"
                alt="Logo ReabilitaCare"
              />
            </a>
          </div>
          <div style="display: flex; align-items: center; gap: 15px">
            <div class="btn-social">
              <a href="#"><i class="bi bi-instagram"></i></a>
              <a href="#"><i class="bi bi-whatsapp"></i></a>
              <a href="#"><i class="bi bi-facebook"></i></a>
            </div>
            <div class="area-usuario">
              <a href="redirecionamento.html" id="btnLogin">Entrar</a>
              <div id="usuarioLogado">
                <span id="nomeUsuario"></span>
                <button onclick="logout()">Sair</button>
              </div>
            </div>
          </div>
        </div>
      </section>
  <section class="bottom-header">
    <div class="interface nav-interface">
      <button class="nav-toggle" id="navToggle" aria-label="Abrir menu">
        <i class="bi bi-list" id="navIcon"></i>
      </button>
      <nav id="navMenu">
        <ul>
          <li><a href="index.html">Início</a></li>
          <li><a href="sobre.html">Sobre</a></li>
          <li><a href="agendamentos.html">Agendamentos</a></li>
          <li><a href="contato.html">Contato</a></li>
        </ul>
      </nav>
    </div>
  </section>
    </header>

    <!-- CONTEÚDO -->
    <main class="pagamento-main">
      <div class="pagamento-card">
        <div class="pagamento-topo">
          <div class="pagamento-icone">
            <i class="bi bi-shield-lock-fill"></i>
          </div>
          <h2>Finalizar Pagamento</h2>
          <p>Ambiente seguro e criptografado</p>
        </div>

        <form id="formPagamento">
          <!-- MÉTODOS -->
          <div class="metodos-label">Forma de pagamento</div>
          <div class="payment-methods">
            <label>
              <input type="radio" name="method" value="credito" checked />
              <div class="method-option">
                <i class="bi bi-credit-card-fill"></i>
                <span>Crédito</span>
              </div>
            </label>
            <label>
              <input type="radio" name="method" value="debito" />
              <div class="method-option">
                <i class="bi bi-credit-card-2-front-fill"></i>
                <span>Débito</span>
              </div>
            </label>
            <label>
              <input type="radio" name="method" value="pix" />
              <div class="method-option">
                <i class="bi bi-qr-code"></i>
                <span>Pix</span>
              </div>
            </label>
          </div>

          <!-- CAMPOS -->
          <div class="campo-grupo">
            <label for="nomeCartao">Nome no cartão</label>
            <input
              type="text"
              id="nomeCartao"
              placeholder="Ex: JOAO DA SILVA"
              required
            />
          </div>

          <div class="campo-grupo">
            <label for="numeroCartao">Número do cartão</label>
            <input
              type="text"
              id="numeroCartao"
              placeholder="0000 0000 0000 0000"
              maxlength="19"
              required
            />
          </div>

          <div class="form-row">
            <div class="campo-grupo">
              <label for="validade">Validade</label>
              <input
                type="text"
                id="validade"
                placeholder="MM/AA"
                maxlength="5"
                required
              />
            </div>
            <div class="campo-grupo">
              <label for="cvv">CVV</label>
              <input
                type="text"
                id="cvv"
                placeholder="000"
                maxlength="3"
                required
              />
            </div>
          </div>

          <div class="campo-grupo">
            <label for="cpf">CPF do titular</label>
            <input
              type="text"
              id="cpf"
              placeholder="000.000.000-00"
              maxlength="14"
              required
            />
          </div>

          <button type="submit" class="btn-pay">
            <i class="bi bi-lock-fill"></i> Pagar Agora
          </button>

          <div class="seguranca">
            <i class="bi bi-shield-check"></i>
            <span>Seus dados estão protegidos com criptografia SSL</span>
          </div>

          <a href="agendamentos.html" class="btn-voltar">
            <i class="bi bi-arrow-left"></i> Voltar para agendamentos
          </a>
        </form>
      </div>
    </main>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const usuario = localStorage.getItem("usuario");
        const btnLogin = document.getElementById("btnLogin");
        const usuarioLogado = document.getElementById("usuarioLogado");
        const nomeUsuario = document.getElementById("nomeUsuario");
        if (usuario) {
          btnLogin.style.display = "none";
          usuarioLogado.style.display = "flex";
          nomeUsuario.innerText = "Olá, " + usuario;
        } else {
          usuarioLogado.style.display = "none";
        }
      });

      function logout() {
        localStorage.removeItem("usuario");
        location.reload();
      }

      // Máscaras
      document
        .getElementById("numeroCartao")
        .addEventListener("input", function () {
          let v = this.value.replace(/\D/g, "").slice(0, 16);
          v = v.replace(/(\d{4})(?=\d)/g, "$1 ");
          this.value = v;
        });

      document
        .getElementById("validade")
        .addEventListener("input", function () {
          let v = this.value.replace(/\D/g, "").slice(0, 4);
          if (v.length >= 3) v = v.slice(0, 2) + "/" + v.slice(2);
          this.value = v;
        });

      document.getElementById("cpf").addEventListener("input", function () {
        let v = this.value.replace(/\D/g, "").slice(0, 11);
        v = v
          .replace(/(\d{3})(\d)/, "$1.$2")
          .replace(/(\d{3})(\d)/, "$1.$2")
          .replace(/(\d{3})(\d{1,2})$/, "$1-$2");
        this.value = v;
      });

      document
        .getElementById("formPagamento")
        .addEventListener("submit", function (e) {
          e.preventDefault();
          const btn = this.querySelector(".btn-pay");
          btn.innerHTML =
            '<i class="bi bi-hourglass-split"></i> Processando...';
          btn.disabled = true;
          setTimeout(() => {
            alert("Pagamento confirmado! Obrigado.");
            window.location.href = "index.html";
          }, 2200);
        });
    </script>
        <script src="../assets/scripts/hamburger.js"></script>
    <script src="../assets/scripts/acessibilidade.js"></script>
</body>
</html>
